user root;
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 64m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format minimal '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        server_name 20.88.127.75;
        location ^~ /.well-known/acme-challenge/ { root /acme; default_type text/plain; }
        location / { return 308 https://20.88.127.75$request_uri; }
    }
    server {
        listen 8443 ssl;
        server_name 20.88.127.75;
        ssl_certificate /etc/letsencrypt/current-selfguard/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/current-selfguard/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        root /usr/share/nginx/html;
        location /api/ {
            proxy_pass http://10.88.0.11:8080;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /healthz { proxy_pass http://10.88.0.11:8080/healthz; }
        location = /livez { proxy_pass http://10.88.0.11:8080/livez; }
        location / { try_files $uri $uri/ /index.html; }
    }
}

name: Export verified release image cache
on:
  workflow_dispatch:
    inputs:
      release:
        description: Existing verified release version
        required: true
        default: v0.1.0
permissions:
  contents: read
  packages: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.release }}
    steps:
      - name: Read and validate the existing release
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --pattern acceptance.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync('release-manifest.json')),a=JSON.parse(fs.readFileSync('acceptance.json'));
          assert.equal(a.status,'PASS');assert.equal(m.version,process.env.RELEASE_VERSION);assert.equal(m.source,'https://github.com/'+process.env.GITHUB_REPOSITORY);assert.match(m.commit,/^[a-f0-9]{40}$/);
          assert.match(m.appImage,/^ghcr\.io\/jojoshine\/self-guard@sha256:[a-f0-9]{64}$/);assert.match(m.wafImage,/^ghcr\.io\/jojoshine\/self-guard-waf@sha256:[a-f0-9]{64}$/);assert.match(m.postgresImage,/^postgres@sha256:[a-f0-9]{64}$/);assert.equal(m.postgresImage,a.postgresImage);
          NODE
      - name: Export the exact published images without rebuilding
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process'),m=JSON.parse(fs.readFileSync('release-manifest.json'));
          const refs=[m.appImage,m.wafImage,m.postgresImage];
          for(const ref of refs)execFileSync('docker',['pull','--platform','linux/amd64',ref],{stdio:'inherit'});
          execFileSync('docker',['image','save','--output','verified-images.tar',...refs],{stdio:'inherit'});
          NODE
          gzip -1 verified-images.tar
          sha256sum verified-images.tar.gz > verified-images.sha256
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-cache-${{ inputs.release }}
          path: |
            verified-images.tar.gz
            verified-images.sha256
            release-manifest.json
            acceptance.json
          retention-days: 1

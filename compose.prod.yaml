name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}
x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '3'}
x-app-environment: &app-environment
  PORT: '8080'
  BASE_PATH: ${BASE_PATH?set BASE_PATH explicitly}
  DATABASE_URL: ${DATABASE_URL:?set runtime DATABASE_URL}
  AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:-}
  ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:?set ENROLLMENT_TOKEN}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  TASK_SIGNING_PRIVATE_KEY: ${TASK_SIGNING_PRIVATE_KEY:?set TASK_SIGNING_PRIVATE_KEY}
  AGENT_UPGRADE_PUBLIC_KEY: ${AGENT_UPGRADE_PUBLIC_KEY:?set AGENT_UPGRADE_PUBLIC_KEY}
  AGENT_PLATFORM_URL: ${AGENT_PLATFORM_URL:?set verified deployment entry}
  AGENT_UPGRADE_ORIGINS: ${AGENT_UPGRADE_ORIGINS:-}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set controlled proxy addresses}
  WAF_RULE_RUNTIME_ENABLED: 'false'
  INTELLIGENCE_HTTPS_PROXY: ${INTELLIGENCE_HTTPS_PROXY:-}
  INTELLIGENCE_PROXY_DNS_OVER_HTTPS: ${INTELLIGENCE_PROXY_DNS_OVER_HTTPS:-false}
  ACCESS_EVIDENCE_DIR: /var/lib/selfguard/access-evidence
  ACCESS_EVIDENCE_MAX_BYTES: ${ACCESS_EVIDENCE_MAX_BYTES:-}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?set digest-pinned POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: selfguard_bootstrap
      POSTGRES_DB: selfguard
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password, db_runtime_password, db_migrator_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U selfguard_bootstrap -d selfguard']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 1
    logging: *logging
  migrate:
    image: ${APP_IMAGE:?set digest-pinned APP_IMAGE}
    profiles: [ops]
    restart: 'no'
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?set migrator DATABASE_URL}
    command: [/app/bin/migrate]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  app:
    image: ${APP_IMAGE:?set digest-pinned APP_IMAGE}
    restart: unless-stopped
    init: true
    environment: *app-environment
    ports: ['127.0.0.1:${APP_PORT:?set APP_PORT}:8080']
    volumes:
      - ./data/intelligence:/var/lib/selfguard/intelligence
      - ./data/agent-artifacts:/var/lib/selfguard/agent-artifacts
      - ./data/access-evidence:/var/lib/selfguard/access-evidence
    tmpfs: ['/tmp:rw,nosuid,nodev,size=128m,mode=1777']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/bin/healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 768m
    cpus: 1.5
    logging: *logging
  backup:
    image: ${POSTGRES_IMAGE:?set digest-pinned POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: selfguard_runtime
      PGDATABASE: selfguard
      PGPASSFILE: /run/secrets/pgpass
    secrets: [pgpass]
    volumes:
      - ./deploy/scheduled-backup.sh:/scripts/scheduled-backup.sh:ro
      - ./backups:/backups
      - ./data/intelligence:/intelligence-artifacts:ro
    command: [sh, /scripts/scheduled-backup.sh]
    depends_on:
      app: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.25
    logging: *logging
secrets:
  db_admin_password: {file: ./secrets/db-admin-password}
  db_runtime_password: {file: ./secrets/db-runtime-password}
  db_migrator_password: {file: ./secrets/db-migrator-password}
  pgpass: {file: ./secrets/pgpass}
volumes:
  postgres_data:
